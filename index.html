<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#035A32" />
    <!--
      Deliberately no apple-mobile-web-app-capable. On iOS it launches the home
      screen icon in a standalone context with its own storage, separate from
      Safari's — and the Google OAuth redirect completes in an in-app browser
      that the standalone app never sees, so sign-in silently never sticks and
      the welcome screen returns on every launch. Re-adding it brings that back.
      Android is unaffected: installed web apps there share Chrome's storage.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <title>matcha pocket</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Fallback face while Mono files load from /public/fonts (licensed PP Neue Montreal Mono) -->
    <link href="https://fonts.cdnfonts.com/css/pp-neue-montreal" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
